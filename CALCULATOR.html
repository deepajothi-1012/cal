<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Calculator</title>
</head>
<body style="margin:0; padding:0; font-family: 'Segoe UI', sans-serif; display:flex; justify-content:center; align-items:center; height:100vh; background-color:#0d0d0d;">

  <div style="background-color:#111; padding:20px; border-radius:15px; box-shadow:0 0 30px #00ffff; width:320px; text-align:center;">
    <input type="text" id="display" disabled placeholder="0" 
           style="width:100%; height:50px; margin-bottom:20px; border-radius:10px; border:none; font-size:1.5em; text-align:right; padding:10px; background-color:#222; color:#00ffff; text-shadow:0 0 5px #00ffff;">

    <div style="display:grid; grid-template-columns:repeat(4, 1fr); gap:12px;">
      <button style="padding:20px; border-radius:10px; border:none; font-size:1.2em; cursor:pointer; background-color:#ff33cc; color:#fff; box-shadow:0 0 10px #ff33cc;" data-value="C">C</button>
      <button style="padding:20px; border-radius:10px; border:none; font-size:1.2em; cursor:pointer; background-color:#ff9900; color:#fff; box-shadow:0 0 10px #ff9900;" data-value="/">÷</button>
      <button style="padding:20px; border-radius:10px; border:none; font-size:1.2em; cursor:pointer; background-color:#ff9900; color:#fff; box-shadow:0 0 10px #ff9900;" data-value="*">×</button>
      <button style="padding:20px; border-radius:10px; border:none; font-size:1.2em; cursor:pointer; background-color:#ff9900; color:#fff; box-shadow:0 0 10px #ff9900;" data-value="-">−</button>

      <button style="padding:20px; border-radius:10px; border:none; font-size:1.2em; cursor:pointer; background-color:#222; color:#00ffff; box-shadow:0 0 10px #00ffff;" data-value="7">7</button>
      <button style="padding:20px; border-radius:10px; border:none; font-size:1.2em; cursor:pointer; background-color:#222; color:#00ffff; box-shadow:0 0 10px #00ffff;" data-value="8">8</button>
      <button style="padding:20px; border-radius:10px; border:none; font-size:1.2em; cursor:pointer; background-color:#222; color:#00ffff; box-shadow:0 0 10px #00ffff;" data-value="9">9</button>
      <button style="padding:20px; border-radius:10px; border:none; font-size:1.2em; cursor:pointer; background-color:#ff9900; color:#fff; box-shadow:0 0 10px #ff9900;" data-value="+">+</button>

      <button style="padding:20px; border-radius:10px; border:none; font-size:1.2em; cursor:pointer; background-color:#222; color:#00ffff; box-shadow:0 0 10px #00ffff;" data-value="4">4</button>
      <button style="padding:20px; border-radius:10px; border:none; font-size:1.2em; cursor:pointer; background-color:#222; color:#00ffff; box-shadow:0 0 10px #00ffff;" data-value="5">5</button>
      <button style="padding:20px; border-radius:10px; border:none; font-size:1.2em; cursor:pointer; background-color:#222; color:#00ffff; box-shadow:0 0 10px #00ffff;" data-value="6">6</button>
      <button style="padding:20px; border-radius:10px; border:none; font-size:1.2em; cursor:pointer; background-color:#222; color:#00ffff; box-shadow:0 0 10px #00ffff;" data-value="=">=</button>

      <button style="padding:20px; border-radius:10px; border:none; font-size:1.2em; cursor:pointer; background-color:#222; color:#00ffff; box-shadow:0 0 10px #00ffff;" data-value="1">1</button>
      <button style="padding:20px; border-radius:10px; border:none; font-size:1.2em; cursor:pointer; background-color:#222; color:#00ffff; box-shadow:0 0 10px #00ffff;" data-value="2">2</button>
      <button style="padding:20px; border-radius:10px; border:none; font-size:1.2em; cursor:pointer; background-color:#222; color:#00ffff; box-shadow:0 0 10px #00ffff;" data-value="3">3</button>
      <button style="padding:20px; border-radius:10px; border:none; font-size:1.2em; cursor:pointer; background-color:#222; color:#00ffff; box-shadow:0 0 10px #00ffff;" data-value=".">.</button>

      <button style="grid-column: span 2; padding:20px; border-radius:10px; border:none; font-size:1.2em; cursor:pointer; background-color:#222; color:#00ffff; box-shadow:0 0 10px #00ffff;" data-value="0">0</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');
    const buttons = document.querySelectorAll('button');

    let currentInput = '';
    let resultDisplayed = false;

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        const value = btn.getAttribute('data-value');

        if(value === 'C') {
          currentInput = '';
          display.value = '';
        } else if(value === '=') {
          try {
            currentInput = eval(currentInput).toString();
            display.value = currentInput;
            resultDisplayed = true;
          } catch {
            display.value = "Error";
          }
        } else {
          if(resultDisplayed) {
            if(['+','-','*','/'].includes(value)) {
              currentInput += value;
            } else {
              currentInput = value;
            }
            resultDisplayed = false;
          } else {
            currentInput += value;
          }
          display.value = currentInput;
        }
      });
    });
  </script>
</body>
</html>
